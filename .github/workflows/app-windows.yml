# Builds the MesoVibe app's Windows installer (NSIS) for pull requests that change the app, so it
# can be tried on a Windows PC. Download it from the run's artifacts. It isn't code-signed, so
# Windows SmartScreen warns before it runs.
name: Windows app

on:
  pull_request:
    paths:
      - "app/**"
      - "engine/**"
      - "ui/**"
      - "sdk/**"
      - "plugins/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/app-windows.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build sdk, plugins and ui
        run: pnpm build
      - name: Build the installer
        run: pnpm tauri build --bundles nsis
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mesovibe-windows-installer
          path: target/release/bundle/nsis/*.exe
          retention-days: 30

name: Feature request
description: Suggest something MesoVibe could do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you'd like
      description: What you're trying to do in the game, and how MesoVibe could help.
    validations:
      required: true
  - type: checkboxes
    id: fair-play
    attributes:
      label: Fair play
      options:
        - label: This works from what's visible in the game window. It needs no input to the game, no memory or file access, and no network traffic.
          required: true

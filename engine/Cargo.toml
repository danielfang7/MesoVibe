[package]
name = "mesovibe-engine"
description = "Screen capture, recognizers and typed game events for MesoVibe. Read-only: no input, memory, file or network access to the game."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Events cross into the app and plugins as JSON; their TypeScript types are generated from these
# definitions (sdk/src/generated).
serde = { version = "1.0.228", features = ["derive"] }
ts-rs = "12.0.1"

# The Windows capture backend (src/capture/windows.rs): Windows.Graphics.Capture and the window
# manager. The same crate and version as the capture tool (tools/capture/windows).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Metadata",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Security_Authorization_AppCapabilityAccess",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

# The macOS capture backend (src/capture/macos.rs): ScreenCaptureKit for the pixels, and the
# window list for finding the game. objc2's bindings are generated from Apple's own headers and
# build as plain Rust (no Swift step); the objc2 crates are the versions Tauri already uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSArray",
  "NSDictionary",
  "NSEnumerator",
  "NSError",
  "NSString",
  "NSValue",
] }
objc2-screen-capture-kit = { version = "=0.3.2", default-features = false, features = [
  "std",
  "SCError",
  "SCShareableContent",
  "SCStream",
  "block2",
  "dispatch2",
  "libc",
  "objc2-core-foundation",
  "objc2-core-graphics",
  "objc2-core-media",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFArray",
  "CFDictionary",
  "CFNumber",
  "CFString",
  "CFCGTypes",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
  "std",
  "CGColorSpace",
  "CGDirectDisplay",
  "CGDisplayConfiguration",
  "CGError",
  "CGGeometry",
  "CGWindow",
  "objc2",
] }
objc2-core-media = { version = "0.3.2", default-features = false, features = [
  "std",
  "CMSampleBuffer",
  "CMTime",
  "objc2-core-video",
] }
objc2-core-video = { version = "0.3.2", default-features = false, features = [
  "std",
  "CVBase",
  "CVBuffer",
  "CVImageBuffer",
  "CVPixelBuffer",
  "CVReturn",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "libc",
  "NSRunningApplication",
  "NSWorkspace",
] }

# Only for examples/replay_exp.rs, which replays private captures (PNG plus meta.json).
[dev-dependencies]
png = "0.18"
serde_json = "1"
